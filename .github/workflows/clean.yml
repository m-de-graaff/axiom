# Clean the whole corpus into a segment index, and render the drop-stats report.
#
# The runner is the backend because the laptop must never hold corpus bytes (roadmap §1) and the
# job is pure CPU over a few gigabytes of Parquet. Modal is the alternative path and runs the
# identical CLI — see `remote/modal/clean_run.py` — but this needs no account review to run today.
#
# Cleaning writes metadata only. Raw Parquet is never rewritten, so a run that goes wrong costs a
# rerun and nothing else (ADR-0018).

name: clean

on:
  workflow_dispatch:
    inputs:
      incremental:
        description: Re-clean only the artifacts whose bytes changed since the last run.
        type: boolean
        default: false
      limit:
        description: Clean only the first N artifacts. Empty means the whole corpus.
        default: ""
      concurrency:
        description: Simultaneous artifact downloads. Above ~8 the Hub rate-limits.
        default: "8"
      derive_tr:
        description: Also build the derived total-return tier (ADR-0019).
        type: boolean
        default: false
      probe:
        description: Skip the clean run; explain why these symbols fragmented instead.
        default: ""
      probe_source:
        description: Source for the probe.
        default: dukascopy
      probe_frequency:
        description: Frequency for the probe.
        default: "1h"

permissions:
  contents: read

concurrency:
  group: clean
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `calendars` brings exchange_calendars, which the XNYS gap predicate needs. Without it
      # every equity series would fail rather than quietly clean against the wrong calendar.
      - run: uv sync --frozen --extra calendars

      - name: Explain why a series fragmented
        if: inputs.probe != ''
        env:
          AXIOM_HF_TOKEN: ${{ secrets.AXIOM_HF_TOKEN }}
          AXIOM_DISABLE_TRACKING: "1"
          HF_HUB_DISABLE_XET: "1"
        run: >-
          uv run axiom clean probe '${{ inputs.probe }}'
          --source '${{ inputs.probe_source }}'
          --frequency '${{ inputs.probe_frequency }}'

      - name: Clean the corpus
        if: inputs.probe == ''
        env:
          AXIOM_HF_TOKEN: ${{ secrets.AXIOM_HF_TOKEN }}
          AXIOM_GIT_COMMIT: ${{ github.sha }}
          AXIOM_DISABLE_TRACKING: "1"
          # Xet mints a read token per request, and thirteen thousand of those in six minutes
          # returns 429 from `/xet-read-token` however patiently the client backs off. The bar
          # files are a few hundred kilobytes each, so Xet's dedup buys nothing here and the
          # plain CDN resolve path does not have that endpoint in it at all.
          HF_HUB_DISABLE_XET: "1"
        run: |
          uv run axiom clean run \
            --config clean_v1 \
            --concurrency '${{ inputs.concurrency }}' \
            ${{ inputs.incremental && '--incremental' || '--full' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Build the total-return tier
        if: inputs.derive_tr && inputs.probe == ''
        env:
          AXIOM_HF_TOKEN: ${{ secrets.AXIOM_HF_TOKEN }}
          AXIOM_GIT_COMMIT: ${{ github.sha }}
          AXIOM_DISABLE_TRACKING: "1"
          HF_HUB_DISABLE_XET: "1"
        run: uv run axiom derive tr

      # The report belongs in git, so it is uploaded and a human commits what they have read.
      # A job that writes to its own repo can be right a hundred times and wrong once.
      - name: Render the drop-stats report
        if: inputs.probe == ''
        env:
          AXIOM_HF_TOKEN: ${{ secrets.AXIOM_HF_TOKEN }}
          AXIOM_DISABLE_TRACKING: "1"
        run: uv run axiom clean report --out docs/reports/v0.3-clean-qa.md

      - name: Upload the report
        if: inputs.probe == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0.3-clean-qa
          path: docs/reports/v0.3-clean-qa.md
          if-no-files-found: warn
