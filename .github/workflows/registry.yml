# Rebuild the corpus registry over every sidecar in `axiom-raw`.
#
# Cheap and idempotent: rebuilding from an unchanged tier reproduces the same `registry_hash`,
# so this is safe to run after every pull and is meant to be. The sidecars stay the truth; the
# registry is a cache with no authority (ADR-0014 conventions, built in v0.2 Phase F).

name: registry

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Simultaneous sidecar downloads.
        default: "16"

permissions:
  contents: read

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen

      - name: Build the registry
        env:
          AXIOM_HF_TOKEN: ${{ secrets.AXIOM_HF_TOKEN }}
          AXIOM_GIT_COMMIT: ${{ github.sha }}
          AXIOM_DISABLE_TRACKING: "1"
        run: uv run axiom registry build --concurrency '${{ inputs.concurrency }}'

      - name: Publish the summary
        if: always()
        run: uv run axiom registry build --dest "$RUNNER_TEMP/registry-local" >/dev/null 2>&1 || true
