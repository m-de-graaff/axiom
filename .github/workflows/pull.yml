# The v0.1 Binance pull, running cloud-to-cloud: the runner talks to Binance Vision and to the
# Hugging Face Hub, and no market-data byte ever reaches the laptop.
#
# Dispatched by hand, never on push. See docs/adr/0013-pull-execution-backend.md for why this is
# GitHub Actions rather than the Modal job the roadmap named.
#
# `gh run cancel` on a run of this workflow is a real SIGKILL of the runner, which makes the
# kill-and-resume drill genuine. Resume needs no flag: the pull is idempotent, so relaunching
# skips every symbol whose sidecar already matches what the bucket publishes.

name: pull

on:
  workflow_dispatch:
    inputs:
      universe:
        description: Universe config — a packaged name or a repo path.
        default: universe_v1
      markets:
        description: Comma-separated markets.
        default: spot,um
      frequencies:
        description: Comma-separated frequencies.
        default: 1h,1d
      limit:
        description: Symbols per market. Empty means the whole universe.
        default: ""
      symbols:
        description: Comma-separated symbols, for smoke runs. Empty means all of them.
        default: ""
      run_id:
        description: Pull run id. Empty means one derived from the clock.
        default: ""
      concurrency:
        description: Cap on simultaneous requests to the bucket.
        default: "12"
      dry_run:
        description: >-
          Write to the runner's disk instead of the Hub. Verifies the fetch, checksum, parse and
          validate path against the real bucket without publishing anything, and leaves nothing
          behind when the runner is torn down.
        type: boolean
        default: false

permissions:
  contents: read

# A second dispatch must not kill the first. Two concurrent pulls would be wasteful rather than
# harmful — idempotence makes them safe — but an accidental cancel loses the run manifest.
concurrency:
  group: pull-binance
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # No `--extra train`: a pull is pyarrow and httpx, and pulling a torch wheel onto a runner
      # that will not import it costs a minute of every dispatch.
      - run: uv sync --frozen

      - name: Pull Binance into axiom-raw
        env:
          AXIOM_HF_TOKEN: ${{ secrets.AXIOM_HF_TOKEN }}
          AXIOM_GIT_COMMIT: ${{ github.sha }}
          AXIOM_STAGING_DIR: ${{ runner.temp }}/axiom-raw-staging
          AXIOM_DISABLE_TRACKING: "1"
        run: |
          uv run axiom pull binance \
            --universe '${{ inputs.universe }}' \
            --markets '${{ inputs.markets }}' \
            --frequencies '${{ inputs.frequencies }}' \
            --backend-tag github \
            --concurrency '${{ inputs.concurrency }}' \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.symbols && format('--symbols {0}', inputs.symbols) || '' }} \
            ${{ inputs.run_id && format('--run-id {0}', inputs.run_id) || '' }}             ${{ inputs.dry_run && format('--dest {0}/raw-dryrun', runner.temp) || '' }}
