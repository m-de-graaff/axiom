# Cross-check population for the yfinance adjunct (v0.2 Phase E, ADR-0016).
#
# Source:    https://en.wikipedia.org/wiki/List_of_S%26P_500_companies
# Retrieved: 2026-08-20
# Contents:  the 503 S&P 500 constituents listed on that page on that date.
#
# The plan called for S&P 500 *plus* Nasdaq-100. The Nasdaq-100 article no longer carries a
# components table in the revision retrieved, and the overlap between the two indices is large
# enough that inventing the missing names from memory would add error without adding coverage.
# So this is the S&P 500 alone, and the file says so rather than implying a union it does not have.
#
# THIS IS NOT A SURVIVORSHIP-SAFE UNIVERSE. It is today's membership of an index that drops its
# losers, retrieved on one date, used only to decide which tickers to ask Yahoo about for splits
# and dividends. It governs nothing downstream: it is not the training universe (that is built
# from the pulled data in Phase F) and it is not a sampling frame for anything evaluated.
#
# `symbol` is the ticker as the index lists it. `yahoo_symbol` is the same ticker in Yahoo's
# spelling, which writes a class suffix with a dash where the index writes a dot (BRK.B -> BRK-B).
index: S&P 500
note: cross-check population only; not survivorship-safe, governs no sampling
