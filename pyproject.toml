[project]
name = "axiom"
version = "0.0.1"
description = "Axiom: finance-native TSFM (Kronos fork) + signals + trading loop"
requires-python = ">=3.11"
# NOTE: torch is intentionally NOT listed — install per machine (CPU wheel on
# the laptop, ROCm wheel on the XTX box, CUDA inside the Modal image).
# See CLAUDE.md.
dependencies = [
  "axiom-model",
  "axiom-data",
  "axiom-eval",
  "axiom-signals",
  "axiom-trader",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
axiom-model = { workspace = true }
axiom-data = { workspace = true }
axiom-eval = { workspace = true }
axiom-signals = { workspace = true }
axiom-trader = { workspace = true }

[tool.ruff]
line-length = 100
extend-exclude = ["vendor", "apps", "data", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Ported verbatim from upstream Kronos (see NOTICE). Kept unreformatted so diffs
# against vendor/kronos stay readable; lint them once they are actually refactored.
"packages/axiom_model/axiom_model/_kronos.py" = ["E501", "F403", "F405", "I001", "UP008"]
"packages/axiom_model/axiom_model/module.py" = ["E501", "F403", "F405", "I001", "UP008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
