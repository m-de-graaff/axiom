[project]
name = "axiom"
version = "0.3.1"
description = "K-line foundation model: discretize-then-autoregress over OHLCV bars."
readme = "README.md"
authors = [{ name = "m-de-graaff", email = "mark_degraaff@outlook.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "typer>=0.15",
    "huggingface-hub>=0.27",
    "trackio>=0.2",
    "pyarrow>=18",
    "httpx>=0.28",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = ["torch>=2.4", "numpy>=1.26"]
kaggle = ["kaggle>=1.6"]
# Source clients the cloud pull jobs need. Not installed on the laptop or in CI: the offline
# tests drive every loader through a synthetic fetcher, so a broker client in CI would buy
# nothing but a network dependency in a suite that must not have one.
data = ["dukascopy-python>=4.0.1", "pandas>=2.2", "yfinance>=0.2.50"]
# NYSE holidays back to 1962, including the moving ones (Good Friday) and the one-off closures
# (9/11, Sandy, state funerals). Hand-rolling that is how a corpus grows silent boundaries.
# Needed by the cleaning engine, so it is in `dev` too -- a CI run that skipped the XNYS gap
# tests would be green about the one rule with an external dependency.
calendars = ["exchange-calendars>=4.13,<5"]
# `axiom registry query` only. The canned reports are group-bys over a few thousand rows and run
# on pyarrow alone; a SQL engine earns its place when the question is arbitrary.
query = ["duckdb>=1.1"]
modalrun = ["modal>=0.68"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "ty>=0.0.1a1",
    "duckdb>=1.1",
    "exchange-calendars>=4.13,<5",
]

[project.scripts]
axiom = "axiom.cli:app"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

# Laptop and CI must never pull CUDA wheels. Cloud images bring their own torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end drills that run a full loop",
    "causality: the v0.4 contract's causal-by-construction properties; v0.8 re-runs these as leakage tripwires",
]
filterwarnings = ["ignore::DeprecationWarning"]
